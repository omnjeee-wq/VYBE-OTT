
name: Build VYBE OTT APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assemblePrereleaseDebug

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/prerelease/debug/app-prerelease-debug.apk app/build/outputs/apk/prerelease/debug/VYBE-Movies.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VYBE-Movies
          path: app/build/outputs/apk/prerelease/debug/VYBE-Movies.apk
          if-no-files-found: error
          
